<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}">
    <img class="avatar" src="{{ site.avatar | relative_url }}" alt="{{ site.title }}">
    <span class="site-title">{{ site.title }}</span>
  </a>

  <nav class="site-nav">
    {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
        <span class="zh-only">{{ item.title }}</span>
        <span class="en-only">{{ item.title_en | default: item.title }}</span>
      </a>
    {% endfor %}
    <button class="theme-toggle lang-toggle" type="button" id="lang-toggle" aria-label="Switch language" title="Switch language">
      <span class="zh-only">EN</span>
      <span class="en-only">中</span>
    </button>
  </nav>
</header>
