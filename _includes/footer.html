<footer class="site-footer">
  <div class="footer-links">
    {% if site.social.github %}<a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
    {% if site.social.rss %}<a href="{{ site.social.rss | relative_url }}">RSS</a>{% endif %}
  </div>
  <p class="footer-meta">
    &copy; {% if site.started_at %}{{ site.started_at | slice: 0, 4 }}{% endif %} {{ site.author }} ·
    <span class="zh-only">自 {{ site.started_at }} 起 · 由 GitHub Pages 与 Jekyll 构建</span>
    <span class="en-only">since {{ site.started_at }} · Built with GitHub Pages &amp; Jekyll</span>
  </p>
</footer>
