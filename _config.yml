# ---- 站点的基本信息 ----
title: Mingrui
tagline: Code with love, until the world is full of it.
description: Jmmt-mingrui's personal blog — tech notes, open-source projects, and thoughts worth keeping.
author: Jmmt-mingrui
avatar: /assets/images/avatar.png
started_at: 2026-08-16

# ---- 站点地址 ----
# 绑定自定义域名后，把 url 改成 https://你的域名 即可。
# baseurl 保持为空：绑了域名后站点就跑在根路径上。
url: ""
baseurl: ""

lang: en
timezone: Asia/Shanghai

# ---- Markdown 渲染 ----
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# 文章链接：/writing/文章标题
permalink: /writing/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

include:
  - assets

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# 所有页面默认套 default 布局，文章再覆盖成 post。
# 这样即使某个 .md 忘了写 layout，也不会退化成裸 HTML。
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ---- 导航 ----
navigation:
  - title: 首页
    title_en: Home
    url: /
  - title: 文章
    title_en: Writing
    url: /archive
  - title: 项目
    title_en: Projects
    url: /projects
  - title: 关于
    title_en: About
    url: /about

# ---- 主页右侧的联系方式 ----
social:
  github: https://github.com/Jmmt-mingrui
  linkedin: https://www.linkedin.com/in/mingrui-li-b03b4b434/
  rss: /feed.xml
