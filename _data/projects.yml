# 加项目就在这个文件里加一条：
#
#   name        项目名（英文小写 + 短横线）
#   description 一句话：它是干什么的、解决什么问题
#   url         链接（有 demo / 官网就填；不方便公开的可以直接删掉这行）
#   image       封面图，放在 assets/images/projects/ 下，路径以 /assets/ 开头
#   type        写 client = 交付项目（别人找我做的）；
#               不写这一行 = 开源项目
#
# 交付项目模板（复制这段，去掉 # 号，换成你自己的内容）：
# - name: project-name
#   description: 给谁做的、做了什么、带来什么效果。
#   url: https://example.com
#   image: /assets/images/projects/project-name.jpg
#   type: client

# ---- 交付项目 ----

- name: velodb-mcp-server
  description: MCP Server for VeloDB Cloud and Enterprise, built on a cloud-native real-time analytical database.
  url: https://github.com/velodb/velodb-mcp-server
  image: /assets/images/projects/velodb-mcp-server.jpg
  type: client

