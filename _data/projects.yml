# 加项目就在这个文件里加一条：
#
#   name        项目名（英文小写 + 短横线）
#   description 一句话：给谁做的、做了什么、带来什么效果
#   url         链接（有 demo / 官网就填；客户私有项目不方便公开，这行可以直接删掉）
#   image       封面图，放在 assets/images/projects/ 下，路径以 /assets/ 开头
#   type        写 client = 别人找我做的（外包 / 委托开发 / 接单）；
#               不写这一行 = 开源项目
#
# 交付项目模板（复制这段，去掉 # 号，换成你自己的内容）：
# - name: canteen-ordering
#   description: 受校内食堂委托做的点餐小程序，微信端下单 + 商家后台，上线后日均订单 800+。
#   url: https://example.com
#   image: /assets/images/projects/canteen-ordering.jpg
#   type: client

# ↓↓↓ 示例（先看效果用，等你给真实信息就替换掉）↓↓↓
